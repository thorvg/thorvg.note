<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThorNote</title>
<link rel="icon" href="favicon.png">
<style>
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; background: #fff; }
html[data-theme="dark"], html[data-theme="dark"] body { background: #1e1e1e; color-scheme: dark; }
.stage { position: fixed; inset: 0; overflow: hidden; }
canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; visibility: hidden; }
.stage[data-state="running"] canvas { visibility: visible; }
textarea { position: absolute; left: 0; top: 0; width: 2px; height: 20px; margin: 0; padding: 0; border: 0; outline: none; resize: none; overflow: hidden; opacity: 0; font-size: 16px; pointer-events: none; }
.status { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #777; font: 13px system-ui, sans-serif; pointer-events: none; }
.stage[data-state="running"] .status { display: none; }
</style>
</head>
<body>
<div class="stage" id="stage" data-layout="note">
    <canvas id="canvas" aria-label="ThorNote editor"></canvas>
    <textarea id="keyboard" aria-label="Editor text input" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
    <div class="status" id="status" role="status">Starting editor…</div>
</div>
<script src="storage.js"></script>
<script src="editor.js"></script>
</body>
</html>
